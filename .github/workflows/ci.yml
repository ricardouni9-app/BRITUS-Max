# CI — verificação de qualidade da fundação.
#
# NOTA: este workflow torna-se efetivo quando (a) as dependências forem
# instaladas (lockfile presente) e (b) o repositório tiver remoto no GitHub.
# Enquanto isso, serve como contrato de qualidade documentado.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck
